name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-and-lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Export Rust humanizer traces
        run: cargo run --locked -p taboom-humanizer --example trace_export -- lab/traces.jsonl
      - name: Install eval lab
        run: python -m pip install -e "./lab[dev]"
      # ratchet: lower the ceiling as the humanizer gets harder to tell from people
      - name: Real-human shape gate (mean AUC ceiling)
        run: >-
          python -m taboom_lab.shape_eval
          --human-fixture lab/data/a11y_cua_su_shape_features.json
          --rust-traces lab/traces.jsonl
          --human-groups p07 p08
          --max-mean-auc 0.97
      - name: Run eval lab tests
        run: python -m pytest lab
      - name: Validate Docker Compose
        run: docker compose config --quiet

  desktop-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chrome
            build_engines: chrome
          - engine: fortress
            build_engines: chrome,fortress
    env:
      TABOOM_ENGINES: ${{ matrix.build_engines }}
      TABOOM_HOST_ARCH: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and start an isolated desktop
        run: docker compose -p taboom-ci up -d --build --wait --wait-timeout 180
      - name: Select Fortress and verify startup
        if: matrix.engine == 'fortress'
        run: |
          docker compose -p taboom-ci exec -T taboom bash -s <<'SCRIPT'
          sed -e 's/^name = "default"$/name = "fortress-ci"/' \
              -e 's/^engine = "chrome"$/engine = "fortress"/' \
              "$TABOOM_HOME/personas/default.toml" > "$TABOOM_HOME/personas/fortress-ci.toml"
          SCRIPT
          TABOOM_PERSONA=fortress-ci docker compose -p taboom-ci up -d --no-build --pull never --wait --wait-timeout 180
      - name: Exercise MCP and the desktop
        run: python scripts/desktop_smoke.py --engine "${{ matrix.engine }}" --artifacts /tmp/taboom-smoke
      - name: Print desktop logs on failure
        if: failure()
        run: docker compose -p taboom-ci logs --tail 200
      - name: Stop the desktop
        if: always()
        run: docker compose -p taboom-ci down
