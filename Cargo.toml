[workspace]
resolver = "2"
members = [
    "crates/taboom-proto",
    "crates/taboom-cli",
    "crates/taboomd",
    "crates/taboom-vmm",
    "crates/taboom-guest",
    "crates/taboom-humanizer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
nix = { version = "0.29", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
maxminddb = "0.24"
rand = { version = "0.8", features = ["std_rng"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
sha1 = "0.10"
data-encoding = "2"
age = { version = "0.11", features = ["armor"] }
tempfile = "3"
axum = "0.7"
base64 = "0.22"
tokio-stream = "0.1"
