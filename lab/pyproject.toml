[project]
name = "taboom-lab"
version = "0.1.0"
description = "Eval lab for Taboom humanizer: recorder, feature extraction, detection, regression tests"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
recorder = ["evdev>=1.6"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# data/ holds the human-shape fixture, not a package
[tool.setuptools]
packages = ["taboom_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
