output HEADLESS-1 resolution 1280x720
output * bg #1a1a2e solid_color

seat seat0 xcursor_theme default 24

input type:pointer {
    accel_profile flat
    pointer_accel 0
}

input type:keyboard {
    xkb_layout us
}

exec google-chrome-stable --ozone-platform=wayland --no-first-run --no-default-browser-check --restore-last-session --user-data-dir=/home/taboom/.config/google-chrome
